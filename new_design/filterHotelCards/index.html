<div class="catalog-toolbar">
    <div class="catalog-toolbar__top">
        <div class="catalog-search">
            <span class="catalog-search__icon">⌕</span>
            <input type="text" placeholder="Ieškoti pagal pavadinimą, SKU ar skonį..." />
        </div>

        <div class="catalog-sort">
            <span class="catalog-sort__label">Rikiuoti:</span>

            <select>
                <option>Numatyta tvarka</option>
                <option>Populiariausi</option>
                <option>Kaina: nuo mažiausios</option>
                <option>Kaina: nuo didžiausios</option>
                <option>Pavadinimas A–Ž</option>
            </select>
        </div>

        <button class="catalog-order">
            <span class="catalog-order__icon">🛒</span>
            <span>Užsakymas</span>
            <span class="catalog-order__count">3</span>
        </button>
    </div>

    <div class="catalog-toolbar__filters">
        <div class="filter-group">
            <div class="filter-group__label">
                <span class="filter-group__icon">◒</span>
                TIPAS
            </div>

            <div class="filter-group__options">
                <button class="filter-chip is-active">Visi</button>
                <button class="filter-chip">Juodoji</button>
                <button class="filter-chip">Žalioji</button>
                <button class="filter-chip">Žolelių &amp; Vaisių</button>
                <button class="filter-chip">Be kofeino</button>
            </div>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group">
            <div class="filter-group__label">
                <span class="filter-group__icon">□</span>
                PAKUOTĖ
            </div>

            <div class="filter-group__options">
                <button class="filter-chip is-active">Visos</button>
                <button class="filter-chip">100g</button>
                <button class="filter-chip">100x2g</button>
                <button class="filter-chip">20 pakelių</button>
                <button class="filter-chip">200g (100 tag)</button>
                <button class="filter-chip">25x2g</button>
                <button class="filter-chip">40x2g</button>
            </div>
        </div>

        <div class="filter-divider"></div>

        <div class="filter-group filter-group--small">
            <div class="filter-group__label">
                <span class="filter-group__icon">◉</span>
                KOFEINAS
            </div>

            <div class="filter-group__options">
                <button class="filter-chip is-active">Visi lygiai</button>
                <button class="filter-chip">Didelis</button>
            </div>
        </div>
    </div>
</div>
