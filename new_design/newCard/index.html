<div class="tea-card">
    <div class="tea-card__media">
        <div class="tea-card__scenario">
            <span class="tea-card__scenario-dot"></span>
            PUSRYČIŲ BUFETAS
        </div>

        <img class="tea-card__image" src="/images/assam-tea.jpg" alt="Ahmad Assam Tea" />

        <div class="tea-card__leaf-preview">
            <img src="/images/assam-leaves.jpg" alt="Assam tea leaves" />
        </div>
    </div>

    <div class="tea-card__body">
        <div class="tea-card__meta">
            <span class="tea-card__brand">AHMAD TEA LONDON</span>
            <span class="tea-card__sku">SKU 54881008006</span>
        </div>

        <div class="tea-card__main-info">
            <div>
                <h3 class="tea-card__title">Ahmad Assam</h3>
                <div class="tea-card__type">Juodoji · Biri arbata</div>
                <div class="tea-card__flavour">Salyklinė · Tvirta</div>
            </div>

            <div class="tea-card__strength">
                <span class="tea-card__strength-label">Stiprumas</span>

                <div class="tea-card__strength-icons" aria-label="Stiprumas 5 iš 5">
                    <span>◒</span>
                    <span>◒</span>
                    <span>◒</span>
                    <span>◒</span>
                    <span>◒</span>
                </div>
            </div>
        </div>

        <div class="tea-card__specs">
            <div class="tea-card__spec">
                <div class="tea-card__spec-icon">▱</div>
                <div>
                    <span class="tea-card__spec-label">Pakuotė</span>
                    <strong>100g</strong>
                </div>
            </div>

            <div class="tea-card__spec-divider"></div>

            <div class="tea-card__spec">
                <div class="tea-card__spec-icon">□</div>
                <div>
                    <span class="tea-card__spec-label">Dėžutėje</span>
                    <strong>24 vnt.</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="tea-card__purchase">
        <div class="tea-card__price-row">
            <div class="tea-card__price">
                <strong>€30.24</strong>
                <span>/ dėžutė</span>
            </div>

            <div class="tea-card__cup-price">
                <strong>€0.05</strong>
                <span>/ puodelis</span>
            </div>
        </div>

        <div class="tea-card__purchase-note">
            24 vnt. dėžutėje · Min. 1 dėžutė
        </div>

        <div class="tea-card__actions">
            <div class="tea-card__qty">
                <button type="button" class="tea-card__qty-btn" data-action="minus" aria-label="Sumažinti kiekį">
                    −
                </button>

                <span class="tea-card__qty-value">
                    <strong data-qty>1</strong>
                    dėžutė
                </span>

                <button type="button" class="tea-card__qty-btn" data-action="plus" aria-label="Padidinti kiekį">
                    +
                </button>
            </div>

            <button class="tea-card__add" type="button">
                <span class="tea-card__cart-icon">🛒</span>
                Į UŽSAKYMĄ
            </button>
        </div>
    </div>
</div>
